<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candy Crush</title>
    <link rel="stylesheet" href="candy.css">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        $(document).ready(function () {
            $('img').click(function () {
                $(this).fadeOut();
            });
            $('#reset-btn').click(function () {
                $('img').fadeIn();
            });
        });
    </script>

</head>

<body>
    <div class="grid">
        <img src="images/orange_candy.png" alt="orange candy">
        <img src="images/red_candy.png" alt="red candy">
        <img src="images/yellow_candy.png" alt="yellow candy">
        <img src="images/multicolor_candy.png" alt="multicolor candy">
        <img src="images/red_candy.png" alt="red candy">
        <img src="images/yellow_candy.png" alt="yellow candy">
        <img src="images/orange_candy.png" alt="orange candy">
        <img src="images/multicolor_candy.png" alt="multicolor candy">
        <img src="images/orange_candy.png" alt="orange candy">
        <img src="images/multicolor_candy.png" alt="multicolor candy">
        <img src="images/yellow_candy.png" alt="yellow candy">
        <img src="images/red_candy.png" alt="red candy">
        <img src="images/yellow_candy.png" alt="yellow candy">
        <img src="images/orange_candy.png" alt="orange candy">
        <img src="images/red_candy.png" alt="red candy">
        <img src="images/multicolor_candy.png" alt="multicolor candy">

    </div>
    <button id="reset-btn">reset</button>
</body>

</html>
